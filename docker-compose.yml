# Postgres local para desenvolvimento e testes de integração.
# O app roda fora do Docker em dev (`pnpm dev`); o Dockerfile é só para produção.
services:
  db:
    image: postgres:16-alpine
    container_name: affiliate_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: affiliate
      POSTGRES_PASSWORD: affiliate
      POSTGRES_DB: affiliate
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U affiliate -d affiliate"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Banco descartável dos testes de integração (fatias seguintes).
  db_test:
    image: postgres:16-alpine
    container_name: affiliate_db_test
    restart: unless-stopped
    environment:
      POSTGRES_USER: affiliate
      POSTGRES_PASSWORD: affiliate
      POSTGRES_DB: affiliate_test
    ports:
      - "5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U affiliate -d affiliate_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
